<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Transparent background -->

  <defs>
    <!-- Masks out the area behind the alarm clock badge so the calendar doesn't poke through it -->
    <mask id="clock-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
      <circle cx="186" cy="182" r="41" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#clock-cutout)">
    <!-- Calendar body (outline only, interior transparent) -->
    <rect x="48" y="56" width="160" height="150" rx="18" fill="none" stroke="#000000" stroke-width="4"/>

    <!-- Calendar top band -->
    <path d="M48 74 a18 18 0 0 1 18 -18 h124 a18 18 0 0 1 18 18 v20 h-160 z" fill="#000000"/>

    <!-- Calendar rings -->
    <rect x="80" y="40" width="14" height="34" rx="7" fill="#000000"/>
    <rect x="162" y="40" width="14" height="34" rx="7" fill="#000000"/>

    <!-- Grid of days (outlined, not filled) -->
    <g fill="none" stroke="#000000" stroke-width="4">
      <rect x="66" y="112" width="24" height="20" rx="5"/>
      <rect x="104" y="112" width="24" height="20" rx="5"/>
      <rect x="142" y="112" width="24" height="20" rx="5"/>
      <rect x="66" y="146" width="24" height="20" rx="5"/>
      <rect x="142" y="146" width="24" height="20" rx="5"/>
    </g>

    <!-- Highlighted scheduled day -->
    <rect x="104" y="146" width="24" height="20" rx="5" fill="#000000"/>
  </g>

  <!-- Alarm clock badge (ring only, center is transparent) -->
  <g transform="translate(186,182)">
    <circle r="34" fill="none" stroke="#000000" stroke-width="6"/>
    <!-- clock hands -->
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <circle r="3" fill="#000000"/>
  </g>
</svg>
