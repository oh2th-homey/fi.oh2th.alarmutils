<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Transparent background -->

  <defs>
    <!-- Masks out the area behind the gear so the clock ring doesn't poke through it -->
    <mask id="gear-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
      <circle cx="178" cy="158" r="27" fill="#000000"/>
    </mask>
  </defs>

  <!-- Clock face (ring only, center is transparent, clipped where the gear overlaps) -->
  <circle cx="128" cy="104" r="72" fill="none" stroke="#000000" stroke-width="8" mask="url(#gear-cutout)"/>

  <!-- Tick marks -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="46" x2="128" y2="54"/>
    <line x1="128" y1="154" x2="128" y2="162"/>
    <line x1="70" y1="104" x2="78" y2="104"/>
    <line x1="178" y1="104" x2="186" y2="104"/>
  </g>

  <!-- Clock hands -->
  <line x1="128" y1="104" x2="128" y2="66" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="104" x2="156" y2="120" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="104" r="6" fill="#000000"/>

  <!-- Gear accent (ring only, center is transparent) -->
  <g transform="translate(178,158)">
    <circle r="20" fill="none" stroke="#000000" stroke-width="6"/>
    <g fill="#000000">
      <rect x="-3" y="-27" width="6" height="10" rx="2"/>
      <rect x="-3" y="17" width="6" height="10" rx="2"/>
      <rect x="-27" y="-3" width="10" height="6" rx="2"/>
      <rect x="17" y="-3" width="10" height="6" rx="2"/>
      <rect x="-3" y="-27" width="6" height="10" rx="2" transform="rotate(45)"/>
      <rect x="-3" y="17" width="6" height="10" rx="2" transform="rotate(45)"/>
      <rect x="-27" y="-3" width="10" height="6" rx="2" transform="rotate(45)"/>
      <rect x="17" y="-3" width="10" height="6" rx="2" transform="rotate(45)"/>
    </g>
  </g>

  <!-- Monospace cron expression snippet (outlined box, no fill) -->
  <rect x="28" y="196" width="200" height="40" rx="8" fill="none" stroke="#000000" stroke-width="4"/>
  <text x="128" y="223" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">* * * * *</text>
</svg>
